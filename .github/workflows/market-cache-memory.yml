name: Bounded market cache regression

on:
  pull_request:
    paths:
      - "live_markets/cache.py"
      - "market_data/layer.py"
      - "tests/test_live_market_cache_bounds.py"
      - ".github/workflows/market-cache-memory.yml"
  workflow_dispatch:

jobs:
  cache-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python modules
        run: python -m py_compile live_markets/cache.py market_data/layer.py
      - name: Test bounded cache and freshness
        run: python -m unittest discover -s tests -p "test_live_market_cache_bounds.py" -v
