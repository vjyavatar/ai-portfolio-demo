name: Trading Desk regression QA
on:
  pull_request:
    paths: ['trading/**', 'tests/trading-*.test.mjs', '.github/workflows/trading-desk-qa.yml']
  push:
    branches: [main]
    paths: ['trading/**', 'tests/trading-*.test.mjs', '.github/workflows/trading-desk-qa.yml']
permissions:
  contents: read
jobs:
  decision-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/trading-decision.test.mjs
      - run: node --input-type=module --check < trading/desk.js
      - run: node --input-type=module --check < trading/notifications-ui.js
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trading-qa-http.log 2>&1 &
          npx playwright test tests/trading-desk.browser.spec.mjs --workers=1 --reporter=line
