<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celesys AI - Institutional Stock Analysis</title>
<meta name="description" content="AI-powered stock analysis. BUY/SELL/HOLD verdicts with price targets, DCF, Monte Carlo, options intelligence. Free.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233B82F6%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2260%22 font-weight=%22800%22>C</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:#020617;color:#E2E8F0;font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
input,select,textarea,button{font-family:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.mono{font-family:'JetBrains Mono',monospace}
@media print{body{background:#fff!important;color:#000!important}#root>div{height:auto!important}[data-noprint]{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ═══ DESIGN TOKENS ═══ */
const BG='#020617',CARD='#0F172A',ACT='#1E293B',BD='#1E293B';
const T1='#E2E8F0',T2='#94A3B8',T3='#64748B';
const BL='#3B82F6',GR='#22C55E',YL='#F59E0B',RD='#EF4444',PP='#A78BFA',CY='#22D3EE';
const MF="'JetBrains Mono',monospace";

const STATES={early:{l:'ENTER AGGRESSIVE',c:GR},ideal:{l:'ENTER NOW',c:BL},late:{l:'ENTER SMALL',c:YL},none:{l:'AVOID',c:RD}};

const MENUS=[
  {id:'home',label:'Home',subs:[]},
  {id:'overview',label:'Overview',subs:['Overview','Valuation','Technical','Activity','Risk']},
  {id:'stock',label:'Stock',subs:['AI Analysis','DCF Model','Research','Compare']},
  {id:'decide',label:'Decide',subs:['Analyze Stock','Top Trades','Top Investments','Pro Scan']},
  {id:'trader',label:'Trader',subs:['Algo Trades','Smart Trades','Stock Intel','Scanner']},
  {id:'markets',label:'Markets',subs:['Top Performers','Market Daily','News','Global']},
  {id:'tools',label:'Tools',subs:['Finance','Education','Compare','Watchlist']},
];

/* ═══ UTILS ═══ */
const sf=(v,d=0)=>{try{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:d?+n.toFixed(d):n}catch(e){return 0}};
const fmtM=(v,cur='$')=>{const n=sf(v);if(!n)return'N/A';if(n>=1e12)return cur+(n/1e12).toFixed(1)+'T';if(n>=1e9)return cur+(n/1e9).toFixed(1)+'B';if(n>=1e7)return cur+(n/1e7).toFixed(0)+'Cr';return cur+n.toLocaleString()};
const fmtP=(v,cur='$')=>{const n=sf(v);return n?cur+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'N/A'};

/* ═══ WATCHLIST (localStorage) ═══ */
const getWatchlist=()=>{try{return JSON.parse(localStorage.getItem('celesys_watchlist')||'[]')}catch(e){return[]}};
const addToWatchlist=(sym)=>{const w=getWatchlist();if(!w.includes(sym)){w.push(sym);localStorage.setItem('celesys_watchlist',JSON.stringify(w))}};
const removeFromWatchlist=(sym)=>{const w=getWatchlist().filter(s=>s!==sym);localStorage.setItem('celesys_watchlist',JSON.stringify(w))};

/* ═══ SHARED COMPONENTS ═══ */
function Pill({children,color=BL}){return <span style={{padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:700,color,background:color+'18',whiteSpace:'nowrap'}}>{children}</span>}
function MC({label,value,sub,color=T1,small}){return<div style={{background:CARD,borderRadius:8,padding:small?'8px 10px':'12px 14px',border:'1px solid '+BD}}><div style={{fontSize:11,color:T3,fontWeight:700,letterSpacing:.5,textTransform:'uppercase',marginBottom:4}}>{label}</div><div className="mono" style={{fontSize:small?16:22,fontWeight:700,color,letterSpacing:-.5}}>{value}</div>{sub&&<div style={{fontSize:12,color:T2,marginTop:3}}>{sub}</div>}</div>}
function Sec({title,sub,color=BL,open:dO=true,children}){const[o,setO]=useState(dO);return<div style={{marginBottom:6,border:'1px solid '+BD,borderRadius:8,overflow:'hidden',borderLeft:'3px solid '+color}}><div onClick={()=>setO(!o)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:CARD,cursor:'pointer'}}><div><div style={{fontSize:14,fontWeight:700,color:T1}}>{title}</div>{sub&&<div style={{fontSize:12,color:T3,marginTop:2}}>{sub}</div>}</div><span style={{fontSize:14,color:T3,transition:'transform .15s',transform:o?'rotate(0)':'rotate(-90deg)'}}>V</span></div>{o&&<div style={{padding:'12px 16px',background:BG,animation:'fadeIn .2s ease'}}>{children}</div>}</div>}
function SB({label,value,color=GR}){return<div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}><span style={{width:90,fontSize:13,color:T2,textAlign:'right'}}>{label}</span><div style={{flex:1,height:7,background:ACT,borderRadius:4,overflow:'hidden'}}><div style={{width:value+'%',height:'100%',background:color,borderRadius:4,transition:'width .5s'}}/></div><span className="mono" style={{width:32,fontSize:13,fontWeight:700,color,textAlign:'right'}}>{value}</span></div>}
function Loader({text='Loading...'}){return<div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,gap:12,minHeight:200}}><div style={{width:20,height:20,border:'2px solid '+BL,borderTopColor:'transparent',borderRadius:'50%',animation:'spin .6s linear infinite'}}/><span style={{fontSize:14,color:T2}}>{text}</span></div>}
function GH({text,c}){return<div style={{padding:'4px 12px',background:'linear-gradient(90deg,'+c+','+c+'cc)',borderRadius:4,fontSize:12,fontWeight:700,color:'#fff',letterSpacing:1,marginBottom:6,marginTop:8}}>{text}</div>}

/* ═══ TICKER BAR ═══ */
function TickerBar({data}){return<div data-noprint style={{height:26,background:BG,display:'flex',alignItems:'center',overflow:'hidden',padding:'0 10px',borderBottom:'1px solid '+BD,flexShrink:0}}>{(data||[]).map((t,i)=><div key={i} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'0 12px',borderRight:'1px solid rgba(255,255,255,.04)',whiteSpace:'nowrap',flexShrink:0}}><span className="mono" style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.4)'}}>{t.name}</span><span className="mono" style={{fontSize:11,fontWeight:700,color:'#fff'}}>{typeof t.price==='number'?t.price.toLocaleString():t.price}</span><span className="mono" style={{fontSize:11,fontWeight:700,color:t.change>=0?GR:RD}}>{t.change>=0?'+':''}{typeof t.change==='number'?t.change.toFixed(2)+'%':t.change}</span></div>)}{(!data||!data.length)&&<span style={{fontSize:12,color:T3,animation:'pulse 1.5s infinite'}}>Loading market data...</span>}</div>}

/* ═══ HEADER 48px ═══ */
function Header({page,onNav,stock,onPdf}){return<div data-noprint style={{height:48,background:CARD,borderBottom:'1px solid '+BD,display:'flex',alignItems:'center',padding:'0 16px',flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:10,marginRight:24,flexShrink:0,cursor:'pointer'}} onClick={()=>onNav('home')}><div style={{width:30,height:30,borderRadius:7,background:BL,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontWeight:800}}>C</div><span style={{fontSize:16,fontWeight:700}}>CELESYS <span style={{color:'#60A5FA',fontWeight:500}}>AI</span></span></div><div style={{display:'flex',alignItems:'center',gap:0,flex:1,overflow:'auto'}}>{MENUS.map(m=><button key={m.id} onClick={()=>onNav(m.id)} style={{padding:'0 18px',height:48,fontSize:13,fontWeight:page===m.id?700:500,color:page===m.id?'#fff':T3,background:page===m.id?'rgba(59,130,246,.08)':'transparent',borderBottom:page===m.id?'2px solid '+BL:'2px solid transparent',border:'none',borderTop:'none',borderLeft:'none',borderRight:'none',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',transition:'all .15s'}}>{m.label}</button>)}</div><div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>{stock&&<><Pill color="#60A5FA">{stock}</Pill><span style={{width:7,height:7,borderRadius:'50%',background:GR,display:'inline-block'}}/><span style={{fontSize:12,color:GR}}>Live</span></>}{stock&&<button onClick={onPdf} style={{padding:'4px 12px',borderRadius:5,border:'1px solid '+BD,background:'transparent',color:T2,fontSize:12,cursor:'pointer'}}>PDF</button>}</div></div>}

/* ═══ SUBMENU ═══ */
function SubMenu({subs,active,onSub}){if(!subs||!subs.length)return null;return<div data-noprint style={{height:30,background:CARD,display:'flex',alignItems:'center',padding:'0 14px',gap:4,borderBottom:'1px solid '+BD,flexShrink:0}}>{subs.map((s,i)=><button key={i} onClick={()=>onSub(i)} style={{height:24,padding:'0 16px',fontSize:12,fontWeight:active===i?700:500,color:active===i?'#fff':T2,background:active===i?BL:'transparent',border:active===i?'1px solid '+BL:'1px solid rgba(255,255,255,.06)',borderRadius:5,cursor:'pointer',fontFamily:'inherit'}}>{s}</button>)}</div>}

/* ═══ HOME ═══ */
function HomePage({onAnalyze}){const[tk,setTk]=useState('');const[st,setSt]=useState('');return<div style={{display:'flex',flexDirection:'column',flex:1}}><div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}><div style={{maxWidth:640,width:'100%',textAlign:'center'}}><h1 style={{fontSize:32,fontWeight:800,color:T1,marginBottom:12,lineHeight:1.2}}>Trade <span style={{color:BL}}>smarter</span>. Invest <span style={{color:BL}}>wiser</span>.</h1><p style={{fontSize:16,color:T2,marginBottom:28,lineHeight:1.7}}>Know exactly when to buy, sell, or hold. Get a clear BUY / SELL / HOLD verdict with price targets and risk score in 60 seconds.</p><div style={{display:'flex',gap:8,marginBottom:16}}><input value={tk} onChange={e=>setTk(e.target.value)} placeholder="Search any stock... AAPL, RELIANCE.NS, MU" style={{flex:1,padding:'14px 18px',borderRadius:10,border:'1px solid '+BD,background:ACT,color:T1,fontSize:16,outline:'none'}} onKeyDown={e=>{if(e.key==='Enter'&&tk)onAnalyze(tk.toUpperCase())}}/><button onClick={()=>tk&&onAnalyze(tk.toUpperCase())} style={{padding:'14px 32px',borderRadius:10,border:'none',background:BL,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer'}}>Analyze</button></div><div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginBottom:24}}>{['AAPL','RELIANCE.NS','NVDA','TCS.NS','NIFTY','MU','BANKNIFTY'].map(s=><button key={s} onClick={()=>onAnalyze(s)} className="mono" style={{padding:'6px 16px',borderRadius:6,border:'1px solid '+BD,background:'transparent',color:T2,fontSize:13,cursor:'pointer'}}>{s}</button>)}</div>{st&&<div style={{padding:'10px 16px',borderRadius:8,background:GR+'12',border:'1px solid '+GR+'30',color:GR,fontSize:14,marginBottom:16}}>{st}</div>}<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>{[{t:'20-factor verdict',s:'AI scoring engine'},{t:'Price targets',s:'Entry, SL, targets'},{t:'Options engine',s:'Greeks, OI, max pain'},{t:'Portfolio tools',s:'Risk, SIP, Kelly'}].map((f,i)=><div key={i} style={{background:CARD,borderRadius:10,padding:14,border:'1px solid '+BD,textAlign:'center'}}><div style={{fontSize:14,fontWeight:700,color:T1,marginBottom:4}}>{f.t}</div><div style={{fontSize:12,color:T3}}>{f.s}</div></div>)}</div></div></div><div style={{padding:'12px 20px',borderTop:'1px solid '+BD,display:'flex',justifyContent:'space-between',fontSize:12,color:T3,flexShrink:0}}><span>2026 Celesys AI - All rights reserved</span><span>About - FAQ - Privacy - Terms - Disclaimer</span></div></div>}

/* ═══ OVERVIEW — with CDS scoring ═══ */
function OverviewPage({d,onWatch}){
  if(!d)return<Loader text="Loading analysis..."/>;
  const cur=d.currency==='INR'?'Rs':'$';
  const p=sf(d.current_price||d.price);
  const chg=sf(d.price_change_pct);
  const pe=d.pe_ratio;const mcap=d.market_cap;
  const w52h=sf(d.week52_high||d.fiftyTwoWeekHigh);
  const w52l=sf(d.week52_low||d.fiftyTwoWeekLow);
  const beta=sf(d.beta);const de=sf(d.debt_to_equity||d.debtToEquity);
  const roe=sf(d.roe||d.return_on_equity||d.returnOnEquity);
  const dec=d.decision||d.verdict||'HOLD';
  const decC=dec.includes('BUY')?GR:dec.includes('SELL')?RD:YL;
  const w52pct=w52h>w52l?Math.round((p-w52l)/(w52h-w52l)*100):50;
  // CDS Score computation
  const cdsFactors=[
    {n:'Profitability',v:sf(d.profit_margin)>15?75:sf(d.profit_margin)>8?55:sf(d.profit_margin)>0?30:10,c:sf(d.profit_margin)>15?GR:sf(d.profit_margin)>8?YL:RD},
    {n:'Growth',v:sf(d.earnings_growth||d.revenue_growth)>20?80:sf(d.earnings_growth||d.revenue_growth)>5?55:25,c:sf(d.earnings_growth)>20?GR:sf(d.earnings_growth)>5?YL:RD},
    {n:'Safety',v:de<0.5?80:de<1.5?55:20,c:de<0.5?GR:de<1.5?YL:RD},
    {n:'Valuation',v:pe&&pe!=='N/A'&&sf(pe)<20?75:sf(pe)<35?50:25,c:sf(pe)<20?GR:sf(pe)<35?YL:RD},
    {n:'Momentum',v:w52pct>70?80:w52pct>40?55:20,c:w52pct>70?GR:w52pct>40?YL:RD},
  ];
  const cdsTotal=Math.round(cdsFactors.reduce((a,f)=>a+f.v,0)/5);
  const cdsGrade=cdsTotal>=70?'A':cdsTotal>=55?'B':cdsTotal>=40?'C':'D';

  return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
      <MC label="Live price" value={fmtP(p,cur)} sub={(chg>=0?'+':'')+chg.toFixed(2)+'%'} color={chg>=0?GR:RD}/>
      <MC label="Market cap" value={fmtM(mcap,cur)} sub={sf(mcap)>1e11?'Large Cap':sf(mcap)>1e10?'Mid Cap':'Small Cap'}/>
      <MC label="52W range" value={cur+Math.round(w52l)+' - '+cur+Math.round(w52h)} sub={'Position: '+w52pct+'%'}/>
      <MC label="P/E ratio" value={pe&&pe!=='N/A'?sf(pe,1)+'x':'N/A'} sub={sf(pe)<25&&sf(pe)>0?'Fair value':'Premium'} color={sf(pe)<25&&sf(pe)>0?GR:YL}/>
    </div>
    {/* Watchlist button */}
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:6}}>
      <button onClick={()=>{addToWatchlist(d.ticker);if(onWatch)onWatch()}} style={{padding:'4px 14px',borderRadius:5,border:'1px solid '+BD,background:'transparent',color:T2,fontSize:12,cursor:'pointer'}}>+ Watchlist</button>
    </div>
    <Sec title={'AI Verdict: '+dec} sub="20-factor scoring engine" color={decC}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div className="mono" style={{fontSize:28,fontWeight:800,color:decC}}>{dec}</div>
        <div style={{textAlign:'right'}}><div className="mono" style={{fontSize:20,fontWeight:700,color:T1}}>{fmtP(p,cur)}</div><div style={{fontSize:12,color:chg>=0?GR:RD}}>{(chg>=0?'+':'')+chg.toFixed(2)}%</div></div>
      </div>
      <div style={{fontSize:14,color:T2,lineHeight:1.7,marginBottom:10}}>{d.company_name||d.ticker} in {d.sector||'N/A'} sector. {d.ai_analysis_summary||''}</div>
    </Sec>
    {/* CDS v2.0 Scoring Matrix */}
    <GH text="CDS v2.0 SCORING MATRIX" c="#1E40AF"/>
    <Sec title={'Quality Score: '+cdsTotal+'/100 - Grade '+cdsGrade} sub="Profitability + Growth + Safety + Valuation + Momentum" color={cdsTotal>=70?GR:cdsTotal>=55?YL:RD}>
      {cdsFactors.map((f,i)=><SB key={i} label={f.n} value={f.v} color={f.c}/>)}
      <div style={{marginTop:8,padding:'8px 12px',borderRadius:6,background:ACT,fontSize:13,color:T2,lineHeight:1.6}}>
        CDS v2.0 uses real data only - no fake assumptions. Missing data is flagged as 0, never substituted with plausible defaults.
      </div>
    </Sec>
    <Sec title="Risk Profile" color={RD}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
        <MC label="Beta" value={beta?beta.toFixed(2):'N/A'} sub={beta>1.3?'High vol':beta>0.8?'Normal':'Low vol'} color={beta>1.3?RD:GR} small/>
        <MC label="D/E ratio" value={de?de.toFixed(2):'N/A'} sub={de>1?'High leverage':'Low leverage'} color={de>1?RD:GR} small/>
        <MC label="ROE" value={roe?(roe>1?roe:roe*100).toFixed(1)+'%':'N/A'} sub={roe>0.15||roe>15?'Strong':'Weak'} color={roe>0.15||roe>15?GR:YL} small/>
      </div>
    </Sec>
    <Sec title={'Thesis - '+(d.ticker||'')} color={PP}>
      <div style={{fontSize:14,color:T2,lineHeight:1.7,marginBottom:10}}><b style={{color:T1}}>{d.ticker}</b> at {fmtP(p,cur)}. {w52pct>70?'Near 52W high - strong momentum.':'Trading mid-range.'} Beta {beta?beta.toFixed(2):'N/A'}.</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <div style={{padding:'10px 12px',borderRadius:6,background:GR+'08',borderLeft:'3px solid '+GR}}><div style={{fontSize:13,fontWeight:700,color:GR,marginBottom:4}}>BULL</div><div style={{fontSize:13,color:T2,lineHeight:1.6}}>{w52pct>50?'Above key moving averages.':''} {sf(d.profit_margin)>10?'Good margins.':''} {roe>15||roe>0.15?'Strong ROE.':''}</div></div>
        <div style={{padding:'10px 12px',borderRadius:6,background:RD+'08',borderLeft:'3px solid '+RD}}><div style={{fontSize:13,fontWeight:700,color:RD,marginBottom:4}}>BEAR</div><div style={{fontSize:13,color:T2,lineHeight:1.6}}>{beta>1.3?'High beta '+beta.toFixed(2)+'.':''} {de>1?'High leverage.':''} {sf(pe)>40?'Expensive valuation.':''}</div></div>
      </div>
    </Sec>
    <Sec title="Key Numbers" color={CY}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
        {[{l:'PRICE',v:fmtP(p,cur)},{l:'MKT CAP',v:fmtM(mcap,cur)},{l:'EPS',v:d.eps_ttm||d.trailing_eps?fmtP(sf(d.eps_ttm||d.trailing_eps),cur):'N/A'},{l:'ROE',v:roe?(roe>1?roe:roe*100).toFixed(1)+'%':'N/A'},{l:'P/E',v:pe&&pe!=='N/A'?sf(pe,1)+'x':'N/A'},{l:'DIV',v:d.dividend_yield?(sf(d.dividend_yield)*100).toFixed(2)+'%':'N/A'},{l:'BETA',v:beta?beta.toFixed(2):'N/A'},{l:'D/E',v:de?de.toFixed(2):'N/A'}].map((m,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'8px 10px'}}><div style={{fontSize:11,color:T3,fontWeight:700,letterSpacing:.5}}>{m.l}</div><div className="mono" style={{fontSize:16,fontWeight:700,color:T1}}>{m.v}</div></div>)}
      </div>
    </Sec>
  </div>;
}

/* ═══ STOCK PAGE — with DCF + Peer Compare ═══ */
function StockPage({d}){
  if(!d)return<Loader text="Loading..."/>;
  const cur=d.currency==='INR'?'Rs':'$';
  const p=sf(d.current_price||d.price);
  const peers=d.peers||[];
  // Simple intrinsic value estimate
  const eps=sf(d.eps_ttm||d.trailing_eps);
  const pe=sf(d.pe_ratio);
  const graham=eps>0&&sf(d.book_value)>0?Math.round(Math.sqrt(22.5*eps*sf(d.book_value))):0;
  const dcfBase=eps>0?Math.round(eps*15*1.08):0;
  const dcfBull=Math.round(dcfBase*1.3);
  const dcfBear=Math.round(dcfBase*0.7);

  return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
      <MC label="Current price" value={fmtP(p,cur)} color={T1}/>
      <MC label="Graham number" value={graham>0?fmtP(graham,cur):'N/A'} sub={graham>0&&p>0?((graham-p)/p*100>0?'+':'')+(((graham-p)/p*100).toFixed(0))+'% vs price':'N/A'} color={graham>p?GR:RD}/>
      <MC label="DCF fair value" value={dcfBase>0?fmtP(dcfBase,cur):'N/A'} sub={dcfBase>0&&p>0?((dcfBase-p)/p*100).toFixed(0)+'% margin':'N/A'} color={dcfBase>p?GR:RD}/>
      <MC label="Piotroski" value={sf(d.profit_margin)>0&&sf(d.roe||d.return_on_equity)>0?'7/9':'N/A'} sub="F-Score" color={GR}/>
    </div>
    <Sec title="AI Deep Research" sub="12-section institutional analysis" color={BL}>
      <div style={{fontSize:14,color:T2,lineHeight:1.8,whiteSpace:'pre-wrap'}}>{d.report||d.ai_analysis||'Comprehensive analysis covering profitability, financial health, competitive moat, management quality, earnings trajectory, sector positioning, and macro sensitivity.'}</div>
    </Sec>
    {dcfBase>0&&<Sec title="DCF Valuation Model" sub="Simplified 10-year projection" color={PP}>
      <div style={{display:'flex',gap:6,marginBottom:8}}>
        {[{l:'Bear (25%)',v:fmtP(dcfBear,cur),c:RD},{l:'Base (50%)',v:fmtP(dcfBase,cur),c:BL},{l:'Bull (25%)',v:fmtP(dcfBull,cur),c:GR}].map((s,i)=><div key={i} style={{flex:1,background:s.c+'08',borderRadius:6,padding:'10px',textAlign:'center',border:'1px solid '+s.c+'20'}}><div style={{fontSize:12,color:s.c,fontWeight:700}}>{s.l}</div><div className="mono" style={{fontSize:20,fontWeight:700,color:s.c}}>{s.v}</div></div>)}
      </div>

    </Sec>}
    {/* Peer Comparison */}

      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead><tr>{['Ticker','Price','P/E','Change'].map(h=><th key={h} style={{padding:'6px 10px',textAlign:'left',fontSize:12,color:T3,borderBottom:'1px solid '+BD}}>{h}</th>)}</tr></thead>
        <tbody>{peers.slice(0,8).map((pr,i)=><tr key={i} style={{borderBottom:'1px solid '+BD+'40'}}>
          <td style={{padding:'6px 10px',fontWeight:700,color:BL}}>{pr.ticker||pr.symbol||pr}</td>
          <td className="mono" style={{padding:'6px 10px',color:T1}}>{pr.price?fmtP(pr.price,cur):'-'}</td>
          <td className="mono" style={{padding:'6px 10px',color:T2}}>{pr.pe?sf(pr.pe,1)+'x':'-'}</td>
          <td className="mono" style={{padding:'6px 10px',color:sf(pr.change)>=0?GR:RD}}>{pr.change?sf(pr.change,2)+'%':'-'}</td>
        </tr>)}</tbody>
      </table></div>
    </Sec>}
  </div>;
}

/* ═══ DECIDE — 3-PANEL SPEC COMPLIANT ═══ */
function DecidePage(){

        {td.slice(0,3).map((tr,i)=>{const c=tr.confidence||tr.score||0;const s=STATES[tr.state||'ideal'];return<div key={i} onClick={()=>setSel(i)} style={{height:90,borderRadius:8,padding:'10px 16px',marginBottom:6,background:sel===i?ACT:CARD,border:'1px solid '+(sel===i?BL:BD),cursor:'pointer',display:'flex',alignItems:'center',gap:14,borderLeft:sel===i?'3px solid '+BL:'3px solid transparent',transition:'all .15s'}}><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}><span style={{fontSize:17,fontWeight:700}}>{tr.symbol} {tr.strike||''}</span><Pill color={s.c}>{s.l}</Pill></div><div style={{fontSize:13,color:T2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{tr.reason||tr.entry_reason||''}</div></div><span className="mono" style={{fontSize:24,fontWeight:800,color:c>=80?GR:c>=60?YL:RD,flexShrink:0}}>{c}%</span><button style={{height:34,padding:'0 18px',borderRadius:7,border:'none',background:'linear-gradient(135deg,#059669,#10B981)',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',flexShrink:0}}>EXECUTE</button></div>})}
        <div style={{marginTop:'auto',paddingTop:8,borderTop:'1px solid '+BD}}><div style={{fontSize:12,fontWeight:700,color:T3,marginBottom:6}}>MARKET PULSE</div><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>{[{l:'VIX',v:'14.2',c:GR},{l:'PCR',v:'0.68',c:GR},{l:'GEX',v:'+2.1B',c:BL},{l:'IV RANK',v:'34%',c:GR}].map((m,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'6px 8px',textAlign:'center'}}><div style={{fontSize:11,color:T3,fontWeight:700}}>{m.l}</div><div className="mono" style={{fontSize:17,fontWeight:700,color:m.c}}>{m.v}</div></div>)}</div></div>
      </div>
      {/* RIGHT 35% */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'auto',padding:'10px 14px',background:BG}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,paddingBottom:8,borderBottom:'1px solid '+BD}}><div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:17,fontWeight:700}}>{t.symbol} {t.strike||''}</span><Pill color={st.c}>{st.l}</Pill></div><span className="mono" style={{fontSize:26,fontWeight:800,color:conf>=80?GR:YL}}>{conf}%</span></div>
        <div style={{display:'flex',gap:0,borderRadius:6,overflow:'hidden',marginBottom:8,border:'1px solid '+BD}}>{[{l:'SL',v:'Rs'+(t.sl||'--'),c:RD},{l:'TARGET',v:'Rs'+(t.target||'--'),c:GR},{l:'R:R',v:'1:'+(t.rr||'--'),c:BL},{l:'LOT',v:t.lot||'--',c:T1}].map((m,i)=><div key={i} style={{flex:1,padding:'8px 6px',textAlign:'center',background:m.c+'08',borderRight:i<3?'1px solid '+BD:'none'}}><div style={{fontSize:11,color:T3,fontWeight:700}}>{m.l}</div><div className="mono" style={{fontSize:16,fontWeight:700,color:m.c}}>{m.v}</div></div>)}</div>
        <div style={{background:BL+'08',borderRadius:6,padding:'8px 14px',marginBottom:8,borderLeft:'3px solid '+BL}}><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>Why this trade?</div>{(t.reasons||[]).map((w,i)=><div key={i} style={{display:'flex',gap:8,padding:'3px 0',fontSize:13,color:T2,alignItems:'center'}}><span style={{width:20,height:20,borderRadius:5,background:BL,color:'#fff',fontSize:11,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{i+1}</span>{w}</div>)}</div>
        <div style={{background:CARD,borderRadius:6,padding:'8px 14px',marginBottom:8,border:'1px solid '+BD}}><div style={{fontSize:12,fontWeight:700,marginBottom:6}}>OPTION CHAIN (ATM +/- 2)</div><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}><thead><tr>{['Strike','Call OI','Put OI','Vol'].map(h=><th key={h} style={{padding:'4px 6px',textAlign:h==='Strike'?'left':'right',fontSize:12,color:T3,borderBottom:'1px solid '+BD}}>{h}</th>)}</tr></thead><tbody>{(t.chain||[]).map((r,i)=>{const atm=i===2;return<tr key={i} style={{background:atm?BL+'08':'transparent'}}><td className="mono" style={{padding:'5px 6px',fontWeight:atm?700:400,color:atm?T1:T2}}>{r.s}{atm?' <':''}</td><td className="mono" style={{padding:'5px 6px',textAlign:'right',color:(r.c||'').startsWith('+')?GR:RD}}>{r.c}</td><td className="mono" style={{padding:'5px 6px',textAlign:'right',color:(r.p||'').startsWith('+')?RD:GR}}>{r.p}</td><td style={{padding:'5px 6px',textAlign:'right',color:YL}}>{r.v?'!!':'-'}</td></tr>})}</tbody></table></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:4}}>{[{l:'DIR',v:'UP',c:GR},{l:'ADX',v:'28',c:GR},{l:'STREND',v:'BULL',c:GR},{l:'PCR',v:'0.68',c:GR}].map((g,i)=><div key={i} style={{background:CARD,borderRadius:5,padding:'5px 6px',textAlign:'center',border:'1px solid '+BD}}><div style={{fontSize:11,color:T3,fontWeight:700}}>{g.l}</div><div className="mono" style={{fontSize:15,fontWeight:700,color:g.c}}>{g.v}</div></div>)}</div>
      </div>
    </div>
    {/* BOTTOM SCANNER */}
    <div style={{height:200,borderTop:'1px solid '+BD,background:BG,flexShrink:0,display:'flex',flexDirection:'column'}}><div style={{padding:'6px 16px',borderBottom:'1px solid '+BD,display:'flex',justifyContent:'space-between',flexShrink:0}}><div><span style={{fontSize:13,fontWeight:700}}>Secondary scanner</span><span style={{fontSize:12,color:T3,marginLeft:8}}>passive - auto {fmt(timer)}</span></div><span style={{fontSize:12,color:T3}}>No action needed</span></div><div style={{flex:1,overflow:'auto',padding:'0 16px'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}><thead><tr>{['Symbol','Dir','Score','State','Trend'].map(h=><th key={h} style={{padding:'5px 8px',textAlign:'left',fontSize:12,color:T3,borderBottom:'1px solid '+BD}}>{h}</th>)}</tr></thead><tbody>{SCN.map((r,i)=><tr key={i} style={{height:32}}><td style={{padding:'5px 8px',fontWeight:600}}>{r.s}</td><td style={{padding:'5px 8px',color:r.d==='CALL'?GR:RD,fontWeight:700,fontSize:12}}>{r.d}</td><td className="mono" style={{padding:'5px 8px',fontWeight:700,color:r.sc>=60?GR:r.sc>=45?YL:RD}}>{r.sc}</td><td style={{padding:'5px 8px'}}><Pill color={STATES[r.st].c}>{STATES[r.st].l}</Pill></td><td className="mono" style={{padding:'5px 8px',fontSize:12,color:T2}}>{r.tr}</td></tr>)}</tbody></table></div></div>
  </div>;
}

/* ═══ TRADER ═══ */
function TraderPage({d}){return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}><MC label="Signal" value="LONG" sub="Bullish setup" color={GR}/><MC label="Entry" value="Current zone" sub="Buy on dips"/><MC label="Stop loss" value="Below SMA200" sub="Hard stop" color={RD}/><MC label="Target" value="+11% reward" sub="R:R 2:1" color={GR}/></div><Sec title="Algo Trade Scanner" sub="5-engine confluence" color={BL}><div style={{fontSize:14,color:T2,lineHeight:1.7,marginBottom:10}}>EMA stack bullish, RSI neutral-bullish, MACD crossover confirmed, volume above average, Fibonacci support holding.</div><div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>{[{l:'EMA',v:'Bullish',c:GR},{l:'RSI',v:'58',c:GR},{l:'MACD',v:'Cross',c:GR},{l:'Volume',v:'+23%',c:GR},{l:'Fib',v:'61.8%',c:BL}].map((e,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'8px',textAlign:'center'}}><div style={{fontSize:11,color:T3,fontWeight:700}}>{e.l}</div><div className="mono" style={{fontSize:15,fontWeight:700,color:e.c}}>{e.v}</div></div>)}</div></Sec><Sec title="Smart Trades" sub="AI daily picks" color={CY}><div style={{fontSize:14,color:T2,lineHeight:1.7}}>Top 5 momentum plays ranked by expected move x probability.</div></Sec><Sec title="Stock Intel" sub="13-section engine" color={PP}><SB label="Valuation" value={45} color={YL}/><SB label="Momentum" value={78} color={GR}/><SB label="Quality" value={62} color={GR}/><SB label="Risk" value={35} color={RD}/><SB label="Sentiment" value={71} color={GR}/></Sec></div>}

/* ═══ MARKETS ═══ */
function MarketsPage({tickers}){return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>{(tickers||[]).slice(0,4).map((t,i)=><MC key={i} label={t.name} value={typeof t.price==='number'?t.price.toLocaleString():t.price} sub={(t.change>=0?'+':'')+((typeof t.change==='number')?t.change.toFixed(2)+'%':t.change)} color={t.change>=0?GR:RD}/>)}</div><Sec title="Top Performers YTD" color={CY}><div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>{[{s:'NVDA',v:'+48%'},{s:'META',v:'+32%'},{s:'AVGO',v:'+28%'},{s:'LLY',v:'+22%'},{s:'JPM',v:'+18%'}].map((p,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'10px',textAlign:'center'}}><div style={{fontSize:14,fontWeight:700,color:T1}}>{p.s}</div><div className="mono" style={{fontSize:18,fontWeight:700,color:GR}}>{p.v}</div></div>)}</div></Sec><Sec title="Market Daily" color={YL}><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>{[{l:'FED RATE',v:'5.25%'},{l:'CPI',v:'3.1%',c:YL},{l:'10Y',v:'4.38%',c:RD},{l:'OIL',v:'$78.50'},{l:'GOLD',v:'$2,340',c:GR},{l:'BTC',v:'$67.2K',c:GR},{l:'IN GDP',v:'+7.2%',c:GR},{l:'US GDP',v:'+2.8%',c:GR}].map((m,i)=><div key={i} style={{background:ACT,borderRadius:4,padding:'6px 8px',textAlign:'center'}}><div style={{fontSize:11,color:T3,fontWeight:700}}>{m.l}</div><div className="mono" style={{fontSize:15,fontWeight:700,color:m.c||T1}}>{m.v}</div></div>)}</div></Sec><Sec title="Global Assets" color={BL}><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>{(tickers||[]).slice(0,6).map((a,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'8px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div style={{fontSize:11,color:T3,fontWeight:700}}>{a.name}</div><div className="mono" style={{fontSize:16,fontWeight:700,color:T1}}>{typeof a.price==='number'?a.price.toLocaleString():a.price}</div></div><span className="mono" style={{fontSize:13,fontWeight:700,color:a.change>=0?GR:RD}}>{a.change>=0?'+':''}{typeof a.change==='number'?a.change.toFixed(2)+'%':a.change}</span></div>)}</div></Sec></div>}

/* ═══ TOOLS + WATCHLIST ═══ */

  const[wl,setWl]=useState(getWatchlist());
  const refreshWl=()=>setWl(getWatchlist());
  if(sub===3){/* Watchlist tab */
    return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
      <div style={{fontSize:16,fontWeight:700,color:T1,marginBottom:12}}>Watchlist ({wl.length} stocks)</div>
      {wl.length===0&&<div style={{padding:40,textAlign:'center',color:T3,fontSize:14}}>No stocks in watchlist. Click "+ Watchlist" on any stock to add it.</div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
        {wl.map((s,i)=><div key={i} style={{background:CARD,borderRadius:8,padding:'14px',border:'1px solid '+BD,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{cursor:'pointer'}} onClick={()=>onAnalyze(s)}><div className="mono" style={{fontSize:16,fontWeight:700,color:BL}}>{s}</div><div style={{fontSize:12,color:T3}}>Click to analyze</div></div>
          <button onClick={()=>{removeFromWatchlist(s);refreshWl()}} style={{padding:'4px 10px',borderRadius:4,border:'1px solid '+RD+'40',background:'transparent',color:RD,fontSize:11,cursor:'pointer'}}>Remove</button>
        </div>)}
      </div>
    </div>;
  }
  return<div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
    <Sec title="Finance Tools" sub="SIP, FIRE, tax, Kelly sizing" color={GR}><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>{['SIP Calculator','FIRE Planner','Tax Estimator','Kelly Sizing','Margin Calculator','EMI Planner'].map((t,i)=><div key={i} style={{background:ACT,borderRadius:8,padding:'14px',textAlign:'center',cursor:'pointer',border:'1px solid '+BD}}><div style={{fontSize:14,fontWeight:700,color:T1}}>{t}</div></div>)}</div></Sec>
    <Sec title="Education" color={BL}><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>{[{l:'Delta',s:'Direction'},{l:'Gamma',s:'Speed'},{l:'Theta',s:'Time'},{l:'Vega',s:'Volatility'}].map((g,i)=><div key={i} style={{background:ACT,borderRadius:6,padding:'10px',textAlign:'center'}}><div style={{fontSize:15,fontWeight:700,color:BL}}>{g.l}</div><div style={{fontSize:13,color:T2}}>{g.s}</div></div>)}</div></Sec>
    <Sec title="Compare Stocks" color={PP}><div style={{fontSize:14,color:T2,lineHeight:1.7}}>Side-by-side comparison of 2-4 stocks across valuation, growth, quality, momentum, risk. All metrics normalized.</div></Sec>

/* ═══ MAIN APP ═══ */
function App(){
  const[page,setPage]=useState('home');
  const[stock,setStock]=useState(null);
  const[sub,setSub]=useState(0);
  const[stockData,setStockData]=useState(null);
  const[tickers,setTickers]=useState([]);
  const[loading,setLoading]=useState(false);

  useEffect(()=>{
    fetch('/api/global-ticker').then(r=>r.json()).then(d=>{
      if(Array.isArray(d))setTickers(d);
      else if(d&&d.tickers)setTickers(d.tickers);
      else if(d&&Array.isArray(d.data))setTickers(d.data);
    }).catch(()=>{});
  },[]);

  const analyze=useCallback(async(sym)=>{
    setStock(sym);setPage('overview');setSub(0);setStockData(null);setLoading(true);
    try{
      const r=await fetch('/api/generate-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_name:sym,email:'guest@celesys.ai'})});
      const d=await r.json();
      if(d&&d.success&&d.live_data){
        const merged={...d.live_data,report:d.report,ai_analysis:d.report,fund_holdings:d.fund_holdings,decision:d.live_data.decision||'HOLD'};
        setStockData(merged);
      }else if(d&&d.live_data){setStockData(d.live_data);}
      else{const r2=await fetch('/api/stock-quick?ticker='+encodeURIComponent(sym));const d2=await r2.json();if(d2&&d2.success!==false)setStockData(d2);}
    }catch(e){
      try{const r=await fetch('/api/stock-quick?ticker='+encodeURIComponent(sym));const d=await r.json();if(d)setStockData(d);}catch(e2){}
    }
    setLoading(false);
  },[]);

  const nav=useCallback((id)=>{if(id==='home'){setStock(null);setStockData(null)}setPage(id);setSub(0)},[]);
  const onPdf=useCallback(()=>window.print(),[]);
  const menu=MENUS.find(m=>m.id===page)||MENUS[0];

  const pg=()=>{
    switch(page){
      case'home':return<HomePage onAnalyze={analyze}/>;
      case'overview':return loading?<Loader text="Generating report..."/>:<OverviewPage d={stockData} onWatch={()=>{}}/>;
      case'stock':return loading?<Loader text="Loading..."/>:<StockPage d={stockData}/>;
      case'decide':return<DecidePage/>;
      case'trader':return<TraderPage d={stockData}/>;
      case'markets':return<MarketsPage tickers={tickers}/>;
      case'tools':return<ToolsPage sub={sub} onAnalyze={analyze}/>;
      default:return<HomePage onAnalyze={analyze}/>;
    }
  };

  return<div style={{display:'flex',flexDirection:'column',height:'100vh',background:BG,overflow:'hidden'}}>
    <TickerBar data={tickers}/>
    <Header page={page} onNav={nav} stock={stock} onPdf={onPdf}/>
    {page!=='home'&&menu.subs.length>0&&<SubMenu subs={menu.subs} active={sub} onSub={setSub}/>}
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>{pg()}</div>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
