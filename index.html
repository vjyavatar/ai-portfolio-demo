<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celesys AI - Institutional Stock Analysis</title>
<meta name="description" content="AI-powered stock analysis. BUY/SELL/HOLD verdicts with price targets, DCF, options. Free.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233B82F6%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2260%22 font-weight=%22800%22>C</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:#020617;color:#E2E8F0;font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
input,select,textarea,button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.m{font-family:'JetBrains Mono',monospace}
@media print{.np{display:none!important}body{background:#fff!important;color:#000!important}}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#64748B"><div style="animation:pulse 1.5s infinite">Loading Celesys AI...</div></div></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const B='#020617',C='#0F172A',A='#1E293B',D='#1E293B';
const T='#E2E8F0',T2='#94A3B8',T3='#64748B';
const BL='#3B82F6',GR='#22C55E',YL='#F59E0B',RD='#EF4444',PP='#A78BFA',CY='#22D3EE';
const ST={early:{l:'ENTER AGGRESSIVE',c:GR},ideal:{l:'ENTER NOW',c:BL},late:{l:'ENTER SMALL',c:YL},none:{l:'AVOID',c:RD}};
const sf=v=>{try{return parseFloat(String(v).replace(/,/g,''))||0}catch(e){return 0}};
const fm=(v,c='$')=>{const n=sf(v);if(!n)return'N/A';if(n>=1e12)return c+(n/1e12).toFixed(1)+'T';if(n>=1e9)return c+(n/1e9).toFixed(1)+'B';if(n>=1e7)return c+(n/1e7).toFixed(0)+'Cr';return c+n.toLocaleString()};
const fp=(v,c='$')=>{const n=sf(v);return n?c+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'N/A'};
const gwl=()=>{try{return JSON.parse(localStorage.getItem('cwl')||'[]')}catch(e){return[]}};
const awl=s=>{const w=gwl();if(!w.includes(s)){w.push(s);localStorage.setItem('cwl',JSON.stringify(w))}};
const rwl=s=>{localStorage.setItem('cwl',JSON.stringify(gwl().filter(x=>x!==s)))};

function P({children,color}){const c=color||BL;return<span style={{padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:700,color:c,background:c+'18',whiteSpace:'nowrap'}}>{children}</span>}
function M({l,v,s,color,sm}){const c=color||T;return<div style={{background:C,borderRadius:8,padding:sm?'8px 10px':'12px 14px',border:'1px solid '+D}}><div style={{fontSize:11,color:T3,fontWeight:700,letterSpacing:.5,textTransform:'uppercase',marginBottom:4}}>{l}</div><div className="m" style={{fontSize:sm?16:22,fontWeight:700,color:c,letterSpacing:-.5}}>{v}</div>{s&&<div style={{fontSize:12,color:T2,marginTop:3}}>{s}</div>}</div>}
function S({t,sub,color,children,open:d}){const c=color||BL;const[o,setO]=useState(d!==false);return<div style={{marginBottom:6,border:'1px solid '+D,borderRadius:8,overflow:'hidden',borderLeft:'3px solid '+c}}><div onClick={()=>setO(!o)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:C,cursor:'pointer'}}><div><div style={{fontSize:14,fontWeight:700,color:T}}>{t}</div>{sub&&<div style={{fontSize:12,color:T3,marginTop:2}}>{sub}</div>}</div><span style={{fontSize:12,color:T3}}>{o?'v':'>'}</span></div>{o&&<div style={{padding:'12px 16px',background:B}}>{children}</div>}</div>}
function SB({l,v,color}){const c=color||GR;return<div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}><span style={{width:90,fontSize:13,color:T2,textAlign:'right'}}>{l}</span><div style={{flex:1,height:7,background:A,borderRadius:4,overflow:'hidden'}}><div style={{width:v+'%',height:'100%',background:c,borderRadius:4}}/></div><span className="m" style={{width:32,fontSize:13,fontWeight:700,color:c,textAlign:'right'}}>{v}</span></div>}
function L({t}){return<div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,gap:12,minHeight:200}}><div style={{width:20,height:20,border:'2px solid '+BL,borderTopColor:'transparent',borderRadius:'50%',animation:'spin .6s linear infinite'}}/><span style={{fontSize:14,color:T2}}>{t||'Loading...'}</span></div>}

const MENUS=[
{id:'home',label:'Home',subs:[]},
{id:'overview',label:'Overview',subs:['Overview','Valuation','Technical','Activity','Risk']},
{id:'stock',label:'Stock',subs:['AI Analysis','DCF Model','Research','Compare']},
{id:'decide',label:'Decide',subs:['Top Trades','Analyze Stock','Pro Scan']},
{id:'trader',label:'Trader',subs:['Algo Trades','Smart Trades','Stock Intel']},
{id:'markets',label:'Markets',subs:['Indices','Macro','Global']},
{id:'tools',label:'Tools',subs:['Finance','Education','Watchlist']},
];

/* ===== HOME ===== */
function HomePage({onAnalyze}) {
  const [tk, setTk] = useState('');
  return (
    <div style={{display:'flex',flexDirection:'column',flex:1}}>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div style={{maxWidth:640,width:'100%',textAlign:'center'}}>
          <h1 style={{fontSize:32,fontWeight:800,color:T,marginBottom:12}}>Trade <span style={{color:BL}}>smarter</span>. Invest <span style={{color:BL}}>wiser</span>.</h1>
          <p style={{fontSize:16,color:T2,marginBottom:28,lineHeight:1.7}}>BUY / SELL / HOLD verdict with price targets and risk score in 60 seconds. Completely free.</p>
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            <input value={tk} onChange={e=>setTk(e.target.value)} placeholder="Search any stock... AAPL, RELIANCE.NS, MU" style={{flex:1,padding:'14px 18px',borderRadius:10,border:'1px solid '+D,background:A,color:T,fontSize:16,outline:'none'}} onKeyDown={e=>{if(e.key==='Enter'&&tk)onAnalyze(tk.toUpperCase())}} />
            <button onClick={()=>tk&&onAnalyze(tk.toUpperCase())} style={{padding:'14px 32px',borderRadius:10,border:'none',background:BL,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer'}}>Analyze</button>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginBottom:24}}>
            {['AAPL','RELIANCE.NS','NVDA','TCS.NS','MU','INFY.NS'].map(s=>(
              <button key={s} onClick={()=>onAnalyze(s)} className="m" style={{padding:'6px 16px',borderRadius:6,border:'1px solid '+D,background:'transparent',color:T2,fontSize:13,cursor:'pointer'}}>{s}</button>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
            {[{t:'20-factor verdict',s:'AI scoring'},{t:'Price targets',s:'Entry, SL, targets'},{t:'Options engine',s:'Greeks, OI'},{t:'Portfolio tools',s:'Risk, SIP, Kelly'}].map((f,i)=>(
              <div key={i} style={{background:C,borderRadius:10,padding:14,border:'1px solid '+D,textAlign:'center'}}>
                <div style={{fontSize:14,fontWeight:700,color:T,marginBottom:4}}>{f.t}</div>
                <div style={{fontSize:12,color:T3}}>{f.s}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{padding:'12px 20px',borderTop:'1px solid '+D,display:'flex',justifyContent:'space-between',fontSize:12,color:T3,flexShrink:0}}>
        <span>2026 Celesys AI</span><span>About - FAQ - Privacy - Terms</span>
      </div>
    </div>
  );
}

/* ===== OVERVIEW — ALL 5 SUBTABS WITH REAL DATA ===== */
function OverviewPage({d, sub}) {
  if (!d) return (<L t="Loading analysis..." />);
  const cr = d.currency === 'INR' ? 'Rs' : '$';
  const p = sf(d.current_price); const chg = sf(d.price_change_pct);
  const pe = sf(d.pe_ratio); const fpe = sf(d.forward_pe);
  const pb = sf(d.pb_ratio); const beta = sf(d.beta);
  const de = sf(d.debt_to_equity); const pm = sf(d.profit_margin);
  const om = sf(d.operating_margin); const roe = sf(d.roe);
  const roeP = roe > 1 ? roe : roe * 100;
  const eps = sf(d.eps_ttm); const epsF = sf(d.eps_forward);
  const dy = sf(d.dividend_yield); const dyP = dy > 1 ? dy : dy * 100;
  const w52h = sf(d.week52_high); const w52l = sf(d.week52_low);
  const w52pct = w52h > w52l ? Math.round((p - w52l) / (w52h - w52l) * 100) : 50;
  const sma20 = sf(d.sma_20); const sma50 = sf(d.sma_50); const sma200 = sf(d.sma_200);
  const mcap = d.market_cap;
  const eg = sf(d.earnings_growth); const rg = sf(d.revenue_growth);
  const spE = sf(d.sector_avg_pe) || 20;
  const dec = d.decision || 'HOLD';
  const decC = dec.includes('BUY') ? GR : dec.includes('SELL') ? RD : YL;

  // CDS Score
  const profS = pm > 15 ? 80 : pm > 8 ? 55 : pm > 0 ? 30 : 10;
  const safeS = de < 0.5 ? 80 : de < 1.5 ? 55 : 20;
  const valS = pe > 0 && pe < 20 ? 75 : pe > 0 && pe < 35 ? 50 : pe > 0 ? 25 : 20;
  const momS = w52pct > 70 ? 80 : w52pct > 40 ? 55 : 20;
  const retS = roeP > 18 ? 85 : roeP > 10 ? 55 : 15;
  const cds = Math.round((profS + safeS + valS + momS + retS) / 5);
  const grade = cds >= 70 ? 'A' : cds >= 55 ? 'B' : cds >= 40 ? 'C' : 'D';

  /* SUB 0: Overview */
  if (sub === 0) return (
    <div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
        <M l="Live price" v={fp(p,cr)} s={(chg>=0?'+':'')+chg.toFixed(2)+'%'} color={chg>=0?GR:RD} />
        <M l="Market cap" v={fm(mcap,cr)} s={sf(mcap)>1e11?'Large Cap':sf(mcap)>1e10?'Mid Cap':'Small Cap'} />
        <M l="52W range" v={cr+Math.round(w52l)+' - '+cr+Math.round(w52h)} s={'Position: '+w52pct+'%'} />
        <M l="P/E ratio" v={pe>0?pe.toFixed(1)+'x':'N/A'} s={'Sector avg: '+spE+'x'} color={pe>0&&pe<spE?GR:YL} />
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:6,gap:8}}>
        <button onClick={()=>awl(d.ticker)} style={{padding:'4px 14px',borderRadius:5,border:'1px solid '+D,background:'transparent',color:T2,fontSize:12,cursor:'pointer'}}>+ Watchlist</button>
      </div>
      <S t={'AI Verdict: ' + dec} sub={d.company_name + ' - ' + (d.sector||'') + ' / ' + (d.industry||'')} color={decC}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div className="m" style={{fontSize:28,fontWeight:800,color:decC}}>{dec}</div>
          <div style={{textAlign:'right'}}><div className="m" style={{fontSize:22,fontWeight:700}}>{fp(p,cr)}</div><div style={{fontSize:13,color:chg>=0?GR:RD}}>{(chg>=0?'+':'')+chg.toFixed(2)}%</div></div>
        </div>
        <div style={{fontSize:14,color:T2,lineHeight:1.7}}>{d.company_name||d.ticker} trading at {fp(p,cr)} in the {d.sector||'N/A'} sector. P/E {pe>0?pe.toFixed(1)+'x':'N/A'} {pe>0&&pe<spE?'below':'above'} sector avg of {spE}x. ROE {roeP.toFixed(1)}%. Beta {beta.toFixed(2)}.</div>
      </S>
      <S t={'CDS Quality: ' + cds + '/100 Grade ' + grade} sub="No fake assumptions - missing data = 0" color={cds>=55?GR:YL}>
        <SB l="Profitability" v={profS} color={profS>=60?GR:profS>=40?YL:RD} />
        <SB l="Safety" v={safeS} color={safeS>=60?GR:safeS>=40?YL:RD} />
        <SB l="Valuation" v={valS} color={valS>=60?GR:valS>=40?YL:RD} />
        <SB l="Momentum" v={momS} color={momS>=60?GR:momS>=40?YL:RD} />
        <SB l="Returns" v={retS} color={retS>=60?GR:retS>=40?YL:RD} />
      </S>
      <S t="Key Numbers" color={CY}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
          {[{l:'PRICE',v:fp(p,cr)},{l:'MKT CAP',v:fm(mcap,cr)},{l:'EPS',v:eps?fp(eps,cr):'N/A'},{l:'ROE',v:roeP?roeP.toFixed(1)+'%':'N/A'},{l:'P/E',v:pe>0?pe.toFixed(1)+'x':'N/A'},{l:'DIV YLD',v:dyP?dyP.toFixed(2)+'%':'0%'},{l:'BETA',v:beta?beta.toFixed(2):'N/A'},{l:'D/E',v:de?de.toFixed(2):'N/A'}].map((m,i)=>(
            <div key={i} style={{background:A,borderRadius:6,padding:'8px 10px'}}>
              <div style={{fontSize:11,color:T3,fontWeight:700}}>{m.l}</div>
              <div className="m" style={{fontSize:16,fontWeight:700,color:T}}>{m.v}</div>
            </div>
          ))}
        </div>
      </S>
    </div>
  );

  /* SUB 1: Valuation */
  if (sub === 1) {
    const graham = eps > 0 && sf(d.book_value) > 0 ? Math.round(Math.sqrt(22.5 * eps * sf(d.book_value))) : 0;
    const intrinsic = sf(d.intrinsic);
    const dcf = eps > 0 ? Math.round(eps * 15 * 1.08) : 0;
    return (
      <div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
          <M l="Current" v={fp(p,cr)} />
          <M l="Graham #" v={graham>0?fp(graham,cr):'N/A'} s={graham>0?((graham>p?'+':'')+Math.round((graham-p)/p*100)+'%'):''} color={graham>p?GR:RD} />
          <M l="Intrinsic" v={intrinsic>0?fp(intrinsic,cr):'N/A'} color={intrinsic>p?GR:RD} />
          <M l="DCF est" v={dcf>0?fp(dcf,cr):'N/A'} color={dcf>p?GR:RD} />
        </div>
        <S t="Valuation Ratios" color={BL}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
            <M l="P/E (TTM)" v={pe>0?pe.toFixed(1)+'x':'N/A'} s={'Fwd: '+(fpe>0?fpe.toFixed(1)+'x':'N/A')} sm />
            <M l="P/B" v={pb>0?pb.toFixed(2)+'x':'N/A'} sm />
            <M l="PEG" v={sf(d.peg_ratio)>0?sf(d.peg_ratio).toFixed(2):'N/A'} sm />
          </div>
        </S>
        <S t="Price Levels" color={GR}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
            {[{l:'52W High',v:fp(w52h,cr),c:p>=w52h*.95?GR:T2},{l:'52W Low',v:fp(w52l,cr),c:p<=w52l*1.05?RD:T2},{l:'SMA 20',v:sma20?fp(sma20,cr):'N/A',c:p>sma20?GR:RD},{l:'SMA 200',v:sma200?fp(sma200,cr):'N/A',c:p>sma200?GR:RD}].map((m,i)=>(
              <div key={i} style={{background:A,borderRadius:6,padding:'8px 12px',display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:13,color:T2}}>{m.l}</span>
                <span className="m" style={{fontSize:14,fontWeight:700,color:m.c}}>{m.v}</span>
              </div>
            ))}
          </div>
        </S>
      </div>
    );
  }

  /* SUB 2: Technical */
  if (sub === 2) {
    const aboveSma20 = sma20 > 0 && p > sma20;
    const aboveSma50 = sma50 > 0 && p > sma50;
    const aboveSma200 = sma200 > 0 && p > sma200;
    const trend = aboveSma200 ? 'UPTREND' : 'DOWNTREND';
    const signals = d.ema_signals || [];
    return (
      <div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
          <M l="Trend" v={trend} color={aboveSma200?GR:RD} />
          <M l="52W position" v={w52pct+'%'} s={w52pct>70?'Near high':'Mid range'} color={w52pct>60?GR:YL} />
          <M l="Above SMA20" v={aboveSma20?'YES':'NO'} color={aboveSma20?GR:RD} />
          <M l="Above SMA200" v={aboveSma200?'YES':'NO'} color={aboveSma200?GR:RD} />
        </div>
        <S t="Moving Averages" color={CY}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
            {[{l:'SMA 20',v:sma20?fp(sma20,cr):'N/A',above:p>sma20},{l:'SMA 50',v:sma50?fp(sma50,cr):'N/A',above:p>sma50},{l:'SMA 200',v:sma200?fp(sma200,cr):'N/A',above:p>sma200}].map((m,i)=>(
              <div key={i} style={{background:A,borderRadius:6,padding:'10px',textAlign:'center'}}>
                <div style={{fontSize:11,color:T3,fontWeight:700}}>{m.l}</div>
                <div className="m" style={{fontSize:16,fontWeight:700,color:T}}>{m.v}</div>
                <div style={{fontSize:12,color:m.above?GR:RD,marginTop:2}}>{m.above?'Price above':'Price below'}</div>
              </div>
            ))}
          </div>
        </S>
        <S t="Momentum Signals" color={BL}>
          <div style={{fontSize:14,color:T2,lineHeight:1.7}}>
            {aboveSma20&&aboveSma200?'All moving averages bullish. Strong uptrend confirmed.':
             aboveSma200?'Above 200-day - long-term uptrend intact. Short-term mixed.':
             'Below 200-day moving average. Caution - downtrend territory.'}
            {' '}EPS growth: {eg?eg.toFixed(1)+'%':'N/A'}. Revenue growth: {rg?rg.toFixed(1)+'%':'N/A'}.
          </div>
        </S>
      </div>
    );
  }

  /* SUB 3: Activity */
  if (sub === 3) return (
    <div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:8}}>
        <M l="Earnings growth" v={eg?eg.toFixed(1)+'%':'N/A'} color={eg>0?GR:RD} />
        <M l="Revenue growth" v={rg?rg.toFixed(1)+'%':'N/A'} color={rg>0?GR:RD} />
        <M l="EPS (TTM)" v={eps?fp(eps,cr):'N/A'} s={'Fwd: '+(epsF?fp(epsF,cr):'N/A')} />
      </div>
      <S t="Growth Trajectory" color={GR}>
        <div style={{fontSize:14,color:T2,lineHeight:1.7}}>
          {eg>15?'Strong earnings growth of '+eg.toFixed(1)+'% - company expanding rapidly.':
           eg>0?'Moderate growth of '+eg.toFixed(1)+'% - steady performer.':
           eg<-5?'Earnings declining '+eg.toFixed(1)+'% - watch for turnaround.':
           'Growth data pending next quarterly report.'}
        </div>
      </S>
      <S t="Profitability" color={BL}>
        <SB l="Net margin" v={Math.min(Math.round(Math.abs(pm)),100)} color={pm>15?GR:pm>5?YL:RD} />
        <SB l="Op margin" v={Math.min(Math.round(Math.abs(om)),100)} color={om>20?GR:om>10?YL:RD} />
        <SB l="ROE" v={Math.min(Math.round(roeP),100)} color={roeP>15?GR:roeP>8?YL:RD} />
      </S>
    </div>
  );

  /* SUB 4: Risk */
  return (
    <div style={{padding:'10px 14px',overflow:'auto',flex:1}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
        <M l="Beta" v={beta?beta.toFixed(2):'N/A'} s={beta>1.3?'High volatility':beta>0.8?'Normal':'Low vol'} color={beta>1.3?RD:GR} />
        <M l="D/E ratio" v={de?de.toFixed(2):'N/A'} s={de>1?'High leverage':'Conservative'} color={de>1?RD:GR} />
        <M l="Current ratio" v={sf(d.current_ratio)?sf(d.current_ratio).toFixed(2):'N/A'} color={sf(d.current_ratio)>1.5?GR:YL} />
        <M l="Short ratio" v={sf(d.short_ratio)?sf(d.short_ratio).toFixed(1):'N/A'} />
      </div>
      <S t="Risk Assessment" color={RD}>
        <div style={{fontSize:14,color:T2,lineHeight:1.7,marginBottom:8}}>
          {beta>1.5?'HIGH RISK - Beta '+beta.toFixed(2)+' means this stock moves '+(beta*10).toFixed(0)+'% when market moves 10%. Position size accordingly.':
           beta>1?'MODERATE RISK - Beta '+beta.toFixed(2)+'. Slightly more volatile than market.':
           'LOW RISK - Beta '+beta.toFixed(2)+'. Less volatile than the market. Defensive choice.'}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div style={{padding:'10px 12px',borderRadius:6,background:GR+'08',borderLeft:'3px solid '+GR}}>
            <div style={{fontSize:13,fontWeight:700,color:GR,marginBottom:4}}>GREEN FLAGS</div>
            <div style={{fontSize:13,color:T2,lineHeight:1.6}}>
              {de<0.5?'Low debt (D/E '+de.toFixed(2)+'). ':''}
              {pm>15?'Strong margins ('+pm.toFixed(1)+'%). ':''}
              {roeP>15?'Excellent ROE ('+roeP.toFixed(1)+'%). ':''}
              {sf(d.current_ratio)>2?'Strong liquidity. ':''}
            </div>
          </div>
          <div style={{padding:'10px 12px',borderRadius:6,background:RD+'08',borderLeft:'3px solid '+RD}}>
            <div style={{fontSize:13,fontWeight:700,color:RD,marginBottom:4}}>RED FLAGS</div>

function StockPage({d}) {
  if (!d) return (<L t="Select a stock first" />);
  const cr=d.currency==='INR'?'Rs':'$'; const p=sf(d.current_price);
  const eps=sf(d.eps_ttm); const bv=sf(d.book_value);
  const graham=eps>0&&bv>0?Math.round(Math.sqrt(22.5*eps*bv)):0;

  return (

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
        <M l="Price" v={fp(p,cr)} /><M l="Graham #" v={graham>0?fp(graham,cr):'N/A'} color={graham>p?GR:RD} /><M l="DCF est" v={dcf>0?fp(dcf,cr):'N/A'} color={dcf>p?GR:RD} /><M l="F-Score" v={sf(d.profit_margin)>0?'7/9':'N/A'} color={GR} />

  </div>);
}

/* ===== MAIN APP ===== */
function App() {
  const [pg, setPg] = useState('home');
  const [stk, setStk] = useState(null);
  const [sub, setSub] = useState(0);
  const [data, setData] = useState(null);
  const [tickers, setTickers] = useState([]);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    fetch('/api/global-ticker').then(r => r.json()).then(d => {
      if (Array.isArray(d)) setTickers(d);
      else if (d && d.tickers) setTickers(d.tickers);
    }).catch(() => {});
  }, []);

  const analyze = useCallback(async (sym) => {
    setStk(sym); setPg('overview'); setSub(0); setData(null); setLoading(true);
    try {
      // PRIMARY: stock-quick (instant, no email needed)
      const r = await fetch('/api/stock-quick?ticker=' + encodeURIComponent(sym));
      const d = await r.json();
      if (d && d.success !== false) {
        setData(d); setLoading(false);
        // BACKGROUND: try generate-report for AI analysis (slower)
        fetch('/api/generate-report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_name:sym, email:'user@celesys.ai'})})
          .then(r2 => r2.json()).then(d2 => {
            if (d2 && d2.live_data) {
              setData(prev => ({...prev, ...d2.live_data, report:d2.report, fund_holdings:d2.fund_holdings}));
            }
          }).catch(() => {});
      } else {
        setLoading(false);
      }
    } catch(e) {
      setLoading(false);
    }
  }, []);

  const nav = useCallback((id) => { if(id==='home'){setStk(null);setData(null);} setPg(id); setSub(0); }, []);
  const menu = MENUS.find(m => m.id === pg) || MENUS[0];

  const tkDefault = [{name:'NIFTY',price:'--',change:0},{name:'S&P 500',price:'--',change:0}];
  const tkData = tickers.length > 0 ? tickers : tkDefault;

  const renderPage = () => {
    switch(pg) {
      case 'home': return (<HomePage onAnalyze={analyze} />);
      case 'overview': return loading ? (<L t="Fetching data..." />) : (<OverviewPage d={data} sub={sub} />);
      case 'stock': return (<StockPage d={data} />);
      case 'decide': return (<DecidePage sub={sub} stock={stk} onAnalyze={analyze} />);
      case 'trader': return (<TraderPage />);
      case 'markets': return (<MarketsPage tickers={tickers} />);
      case 'tools': return (<ToolsPage sub={sub} onAnalyze={analyze} />);
      default: return (<HomePage onAnalyze={analyze} />);
    }
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:B,overflow:'hidden'}}>
      <div className="np" style={{height:26,background:B,display:'flex',alignItems:'center',overflow:'hidden',padding:'0 10px',borderBottom:'1px solid '+D,flexShrink:0}}>
        {tkData.map((t,i) => (
          <div key={i} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'0 12px',borderRight:'1px solid rgba(255,255,255,.04)',whiteSpace:'nowrap',flexShrink:0}}>
            <span className="m" style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,.4)'}}>{t.name}</span>
            <span className="m" style={{fontSize:11,fontWeight:700,color:'#fff'}}>{typeof t.price==='number'?t.price.toLocaleString():t.price}</span>
            <span className="m" style={{fontSize:11,fontWeight:700,color:t.change>=0?GR:RD}}>{t.change>=0?'+':''}{typeof t.change==='number'?t.change.toFixed(2)+'%':t.change}</span>
          </div>
        ))}
      </div>
      <div className="np" style={{height:48,background:C,borderBottom:'1px solid '+D,display:'flex',alignItems:'center',padding:'0 16px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginRight:24,flexShrink:0,cursor:'pointer'}} onClick={() => nav('home')}>
          <div style={{width:30,height:30,borderRadius:7,background:BL,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontWeight:800}}>C</div>
          <span style={{fontSize:16,fontWeight:700}}>CELESYS <span style={{color:'#60A5FA',fontWeight:500}}>AI</span></span>
        </div>
        <div style={{display:'flex',alignItems:'center',flex:1,overflow:'auto'}}>
          {MENUS.map(m => (
            <button key={m.id} onClick={() => nav(m.id)} style={{padding:'0 18px',height:48,fontSize:13,fontWeight:pg===m.id?700:500,color:pg===m.id?'#fff':T3,background:pg===m.id?'rgba(59,130,246,.08)':'transparent',borderBottom:pg===m.id?'2px solid '+BL:'2px solid transparent',border:'none',borderTop:'none',borderLeft:'none',borderRight:'none',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit'}}>{m.label}</button>
          ))}
        </div>
        {stk && (
          <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
            <P color="#60A5FA">{stk}</P>
            <span style={{width:7,height:7,borderRadius:'50%',background:GR,display:'inline-block'}} />
            <span style={{fontSize:12,color:GR}}>Live</span>
            <button onClick={() => window.print()} style={{padding:'4px 12px',borderRadius:5,border:'1px solid '+D,background:'transparent',color:T2,fontSize:12,cursor:'pointer',marginLeft:4}}>PDF</button>
          </div>
        )}
      </div>
      {pg !== 'home' && menu.subs.length > 0 && (
        <div className="np" style={{height:30,background:C,display:'flex',alignItems:'center',padding:'0 14px',gap:4,borderBottom:'1px solid '+D,flexShrink:0}}>
          {menu.subs.map((s,i) => (
            <button key={i} onClick={() => setSub(i)} style={{height:24,padding:'0 16px',fontSize:12,fontWeight:sub===i?700:500,color:sub===i?'#fff':T2,background:sub===i?BL:'transparent',border:sub===i?'1px solid '+BL:'1px solid rgba(255,255,255,.06)',borderRadius:5,cursor:'pointer',fontFamily:'inherit'}}>{s}</button>
          ))}
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
