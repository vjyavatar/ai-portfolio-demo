# Render Infrastructure-as-Code
# Commit this file, then in Render dashboard: New → Blueprint → point to this repo
# Render will auto-provision everything from this config.

services:
  - type: web
    name: celesys
    runtime: python
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: NODE_VERSION
        value: 20.17.0
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
